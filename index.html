<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스탑워치</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --text: #eef1fb;
    --muted: #9aa4c4;
    --accent: #8ee6b0;
    --danger: #ff9a9a;
    --line: rgba(255,255,255,.08);
    --moon: #f6f1d5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 24px;
    overflow-x: hidden;
    background:
      radial-gradient(ellipse at 50% 120%, #2a2f6b 0%, transparent 60%),
      radial-gradient(ellipse at 15% 10%, rgba(88,60,150,.35) 0%, transparent 50%),
      linear-gradient(180deg, #050816 0%, #0b1236 45%, #18205a 80%, #23296b 100%);
    background-attachment: fixed;
  }

  /* 별 캔버스 */
  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
    border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border-radius: 32px;
    padding: 36px 28px 24px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.08),
      0 30px 80px rgba(3,6,24,.55);
    opacity: 0;
    transform: scale(.94) translateY(16px);
    filter: blur(6px);
    pointer-events: none;
    transition: opacity .9s ease, transform 1s cubic-bezier(.2,.8,.2,1), filter .9s ease;
  }
  body.ready .wrap {
    opacity: 1;
    transform: none;
    filter: none;
    pointer-events: auto;
  }

  /* ===== 인트로: 밤의 오피스 ===== */
  #intro {
    position: fixed;
    inset: 0;
    z-index: 5;
    overflow: hidden;
    transition: opacity .7s ease;
  }
  #intro.fade { opacity: 0; pointer-events: none; }
  #scene {
    width: 100%;
    height: 100%;
    display: block;
    will-change: transform;
    transition: transform 2.6s cubic-bezier(.7,0,.3,1);
  }
  #skipBtn {
    position: absolute;
    right: 20px;
    bottom: 20px;
    width: auto;
    height: auto;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    background: rgba(20,24,60,.55);
    color: #fff;
    border: 1px solid rgba(255,255,255,.2);
    backdrop-filter: blur(6px);
    transition: opacity .3s;
  }
  #intro.zooming #skipBtn { opacity: 0; }

  .steam path {
    animation: steam 3s ease-in-out infinite;
    opacity: 0;
  }
  .steam path:nth-child(2) { animation-delay: 1s; }
  .steam path:nth-child(3) { animation-delay: 2s; }
  @keyframes steam {
    0%   { opacity: 0; transform: translateY(6px); }
    40%  { opacity: .7; }
    100% { opacity: 0; transform: translateY(-16px); }
  }
  .typing { animation: typing .35s ease-in-out infinite alternate; }
  .typing.r { animation-delay: .17s; }
  @keyframes typing { to { transform: translateY(2px); } }
  .head-nod {
    transform-box: view-box;
    transform-origin: 595px 505px;
    animation: nod 5s ease-in-out infinite;
  }
  @keyframes nod {
    0%, 70%, 100% { transform: rotate(0); }
    80% { transform: rotate(-4deg); }
    90% { transform: rotate(2deg); }
  }
  .sec-hand {
    transform-box: view-box;
    transform-origin: 1330px 170px;
    animation: tick 60s steps(60) infinite;
  }
  @keyframes tick { to { transform: rotate(360deg); } }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .bar-grow {
    transform-box: fill-box;
    transform-origin: bottom;
    animation: grow 4s ease-in-out infinite;
  }
  @keyframes grow { 0%,100% { transform: scaleY(.85); } 50% { transform: scaleY(1); } }
  .lamp-glow { animation: flick 4s ease-in-out infinite; }
  @keyframes flick { 50% { opacity: .85; } }

  /* ===== 달 ===== */
  .moon-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  #moon {
    width: 120px;
    height: 120px;
    overflow: visible;
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-4px); } }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px 5px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.06);
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: .2px;
  }
  .chip::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #f5e7bf;
    box-shadow: 0 0 8px #f5e7bf;
  }

  /* ===== 시간 ===== */
  .time {
    margin-top: 22px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    font-size: clamp(52px, 15vw, 68px);
    font-weight: 200;
    letter-spacing: -2px;
    line-height: 1;
  }
  .time .ms {
    color: var(--muted);
    font-size: .42em;
    font-weight: 300;
    letter-spacing: 0;
    margin-left: 2px;
  }

  /* ===== 버튼 ===== */
  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 30px 0 8px;
  }
  .buttons button {
    height: 54px;
    border-radius: 16px;
    border: none;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .3px;
    cursor: pointer;
    transition: transform .1s ease, background .25s ease, color .25s ease, opacity .25s ease, box-shadow .25s ease;
  }
  .buttons button:active { transform: scale(.97); }
  .buttons button:disabled { opacity: .35; cursor: default; }
  .buttons button:focus-visible { outline: 2px solid rgba(255,255,255,.5); outline-offset: 2px; }
  #lapBtn {
    background: rgba(255,255,255,.07);
    color: var(--text);
  }
  #lapBtn:not(:disabled):hover { background: rgba(255,255,255,.11); }
  #startBtn {
    background: #f5e7bf;
    color: #1a1f46;
    box-shadow: 0 8px 24px rgba(245,231,191,.18);
  }
  #startBtn:hover { background: #fbefcc; }
  #startBtn.running {
    background: rgba(255,255,255,.07);
    color: #ffb4a8;
    box-shadow: none;
  }

  /* ===== 랩 목록 ===== */
  .laps { margin-top: 14px; }
  .laps:empty { display: none; }
  .lap-head, .lap-row {
    display: grid;
    grid-template-columns: 56px 1fr 1fr;
    align-items: center;
    padding: 0 6px;
  }
  .lap-head {
    font-size: 11px;
    font-weight: 500;
    color: rgba(154,164,196,.7);
    padding-bottom: 8px;
    letter-spacing: .4px;
  }
  .lap-head span:not(:first-child), .lap-row span:not(:first-child) { text-align: right; }
  .lap-list {
    list-style: none;
    max-height: 200px;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .lap-list::-webkit-scrollbar { display: none; }
  .lap-row {
    height: 44px;
    border-top: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    animation: rowIn .3s ease;
  }
  @keyframes rowIn { from { opacity: 0; transform: translateY(-4px); } }
  .lap-row .n { color: var(--muted); font-size: 13px; }
  .lap-row .total { color: var(--muted); }
  .lap-row.current .split { color: var(--text); }
  .lap-row.best .split { color: var(--accent); }
  .lap-row.worst .split { color: #ffb4a8; }

  .hint {
    margin-top: 18px;
    display: flex;
    justify-content: center;
    gap: 14px;
    color: rgba(154,164,196,.7);
    font-size: 11px;
  }
  kbd {
    display: inline-block;
    min-width: 18px;
    margin-right: 4px;
    padding: 1px 5px;
    border-radius: 5px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08);
    font-family: inherit;
    font-size: 10px;
    text-align: center;
    color: var(--muted);
  }
</style>
</head>

      <!-- 확대 목표: 오른쪽 위 유리창 -->
      <rect id="zoomPane" x="807" y="100" width="303" height="223" fill="none"/>

    <button id="skipBtn" type="button">건너뛰기 ›</button>
  </div>

  <div class="wrap">
    <div class="moon-box">
      <svg id="moon" viewBox="-60 -60 120 120" aria-hidden="true">
        <defs>
          <radialGradient id="halo" r=".5">
            <stop offset="35%" stop-color="#f5e7bf" stop-opacity=".22"/>
            <stop offset="100%" stop-color="#f5e7bf" stop-opacity="0"/>
          </radialGradient>
          <clipPath id="litClip"><path id="litClipPath" d=""/></clipPath>
        </defs>
        <circle id="glowCircle" r="60" fill="url(#halo)"/>
        <!-- 어두운 면 -->
        <circle r="36" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12" stroke-width="1"/>
        <!-- 밝은 면 -->
        <path id="litPath" d="" fill="#f5e7bf"/>
        <!-- 크레이터 (밝은 면에만) -->
        <g clip-path="url(#litClip)" fill="#e6d4a3">
          <circle cx="-11" cy="-12" r="6"/>
          <circle cx="12" cy="-4" r="3.6"/>
          <circle cx="-3" cy="14" r="7.5"/>
          <circle cx="17" cy="15" r="3"/>
          <circle cx="-22" cy="6" r="2.6"/>
          <circle cx="5" cy="-24" r="2.2"/>
        </g>
      </svg>
      <div class="chip" id="phaseName">초승달</div>
    </div>

    <div class="time" id="display">00:00<span class="ms">.00</span></div>

    <div class="buttons">
      <button id="lapBtn" disabled>랩</button>
      <button id="startBtn">시작</button>
    </div>

    <div class="laps" id="laps"></div>

    <div class="hint"><span><kbd>Space</kbd>시작·정지</span><span><kbd>L</kbd>랩</span><span><kbd>R</kbd>리셋</span></div>
  </div>

<script>
  /* ===================== 설정 ===================== */
  const MOON_CYCLE_MS = 60 * 1000;  // 달이 한 바퀴(초승달→보름달→초승달) 도는 시간: 60초
  const START_PHASE  = 0.11;        // 시작 위상 (0=그믐/삭, 0.5=보름). 0.11 ≈ 초승달

  /* ===================== 밤하늘 별 ===================== */
  const sky = document.getElementById('sky');
  const ctx = sky.getContext('2d');
  let stars = [];
  let shooting = null;

  function resizeSky() {
    const dpr = window.devicePixelRatio || 1;
    sky.width = innerWidth * dpr;
    sky.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.floor((innerWidth * innerHeight) / 2600);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      r: Math.random() < 0.9 ? Math.random() * 1.1 + 0.2 : Math.random() * 1.6 + 1,
      base: Math.random() * 0.6 + 0.3,
      speed: Math.random() * 0.002 + 0.0006,
      offset: Math.random() * Math.PI * 2,
      hue: Math.random() < 0.15 ? 'rgba(200,215,255,' : Math.random() < 0.1 ? 'rgba(255,235,200,' : 'rgba(255,255,255,'
    }));
  }

  function drawSky(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const s of stars) {
      const a = s.base + Math.sin(t * s.speed + s.offset) * 0.3;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = s.hue + Math.max(0.05, a) + ')';
      ctx.fill();
    }

    // 가끔 별똥별
    if (!shooting && Math.random() < 0.002) {
      shooting = {
        x: Math.random() * innerWidth * 0.7 + innerWidth * 0.2,
        y: Math.random() * innerHeight * 0.35,
        vx: -(Math.random() * 6 + 7),
        vy: Math.random() * 3 + 3,
        life: 0
      };
    }
    if (shooting) {
      const s = shooting;
      const len = 14;
      const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * len, s.y - s.vy * len);
      const alpha = 1 - s.life / 60;
      grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx * len, s.y - s.vy * len);
      ctx.stroke();
      s.x += s.vx; s.y += s.vy; s.life++;
      if (s.life > 60) shooting = null;
    }
    requestAnimationFrame(drawSky);
  }

  addEventListener('resize', resizeSky);
  resizeSky();
  requestAnimationFrame(drawSky);

  /* ===================== 달 위상 ===================== */
  const R = 36;
  const litClipPath = document.getElementById('litClipPath');
  const litPath = document.getElementById('litPath');
  const glowCircle = document.getElementById('glowCircle');
  const phaseName = document.getElementById('phaseName');

  // phase: 0~1 (0=삭, 0.25=상현, 0.5=보름, 0.75=하현)
  function moonPath(phase) {
    const k = Math.cos(2 * Math.PI * phase);   // 1 → -1 → 1
    const rx = Math.abs(k) * R;
    const waxing = phase < 0.5;
    const outerSweep = waxing ? 1 : 0;           // 차는 달은 오른쪽, 기우는 달은 왼쪽이 밝음
    const termSweep = waxing ? (k > 0 ? 0 : 1) : (k > 0 ? 1 : 0);
    return `M 0 ${-R} A ${R} ${R} 0 0 ${outerSweep} 0 ${R} A ${rx} ${R} 0 0 ${termSweep} 0 ${-R} Z`;
  }

  function phaseLabel(p) {
    if (p < 0.03 || p >= 0.97) return '그믐 · 삭';
    if (p < 0.22) return '초승달';
    if (p < 0.28) return '상현달';
    if (p < 0.47) return '차오르는 달';
    if (p < 0.53) return '보름달';
    if (p < 0.72) return '기우는 달';
    if (p < 0.78) return '하현달';
    return '그믐달';
  }

  function updateMoon(ms) {
    const phase = (START_PHASE + ms / MOON_CYCLE_MS) % 1;
    const d = moonPath(phase);
    litClipPath.setAttribute('d', d);
    litPath.setAttribute('d', d);
    const illum = (1 - Math.cos(2 * Math.PI * phase)) / 2;   // 0~1 밝기
    glowCircle.setAttribute('opacity', (0.1 + illum * 0.9).toFixed(3));
    phaseName.textContent = phaseLabel(phase);
  }

  /* ===================== 스탑워치 ===================== */
  const display = document.getElementById('display');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const lapList = document.getElementById('laps');

  let running = false;
  let startTime = 0;
  let elapsed = 0;
  let laps = [];
  let lastLapTotal = 0;
  let rafId = null;

  function now() { return elapsed + (running ? performance.now() - startTime : 0); }

  function format(ms) {
    const cs = Math.floor(ms / 10) % 100;
    const s = Math.floor(ms / 1000) % 60;
    const m = Math.floor(ms / 60000) % 60;
    const h = Math.floor(ms / 3600000);
    const pad = n => String(n).padStart(2, '0');
    const main = (h > 0 ? h + ':' + pad(m) : pad(m)) + ':' + pad(s);
    return { main, cs: '.' + pad(cs) };
  }

  function render() {
    const ms = now();
    const t = format(ms);
    display.innerHTML = `${t.main}<span class="ms">${t.cs}</span>`;
    updateMoon(ms);
    const cur = lapList.querySelector('.current');
    if (cur) {
      const f = format(ms - lastLapTotal), g = format(ms);
      cur.querySelector('.split').textContent = f.main + f.cs;
      cur.querySelector('.total').textContent = g.main + g.cs;
    }
    if (running) rafId = requestAnimationFrame(render);
  }

  function row(cls, n, split, total) {
    const a = format(split), b = format(total);
    return `<li class="lap-row ${cls}"><span class="n">${String(n).padStart(2, '0')}</span>` +
           `<span class="split">${a.main}${a.cs}</span><span class="total">${b.main}${b.cs}</span></li>`;
  }

  // 랩을 한 번 이상 기록했을 때만 목록 표시
  function renderLaps() {
    if (laps.length === 0) { lapList.innerHTML = ''; return; }
    const min = laps.length >= 2 ? Math.min(...laps) : null;
    const max = laps.length >= 2 ? Math.max(...laps) : null;
    const t = now();
    let html = row('current', laps.length + 1, t - lastLapTotal, t);
    let total = lastLapTotal;
    for (let i = laps.length - 1; i >= 0; i--) {
      const cls = laps[i] === min ? 'best' : laps[i] === max ? 'worst' : '';
      html += row(cls, i + 1, laps[i], total);
      total -= laps[i];
    }
    lapList.innerHTML =
      '<div class="lap-head"><span>랩</span><span>구간</span><span>누적</span></div>' +
      `<ul class="lap-list">${html}</ul>`;
  }

  function toggle() {
    if (running) {
      elapsed = now();
      running = false;
      cancelAnimationFrame(rafId);
      startBtn.textContent = '시작';
      startBtn.classList.remove('running');
      lapBtn.textContent = '리셋';
      render();
    } else {
      startTime = performance.now();
      running = true;
      startBtn.textContent = '정지';
      startBtn.classList.add('running');
      lapBtn.textContent = '랩';
      lapBtn.disabled = false;
      renderLaps();
      render();
    }
  }

  function lap() {
    if (!running) return;
    const total = now();
    laps.push(total - lastLapTotal);
    lastLapTotal = total;
    renderLaps();
  }

  function reset() {
    if (running) return;
    elapsed = 0;
    laps = [];
    lastLapTotal = 0;
    lapBtn.textContent = '랩';
    lapBtn.disabled = true;
    lapList.innerHTML = '';
    render();
  }

  startBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', () => running ? lap() : reset());

  document.addEventListener('keydown', e => {
    if (!introDone) { e.preventDefault(); skipIntro(); return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'l' || e.key === 'L') lap();
    else if (e.key === 'r' || e.key === 'R') reset();
  });

  render();

  /* ===================== 인트로 ===================== */
  const intro = document.getElementById('intro');
  const scene = document.getElementById('scene');
  const zoomPane = document.getElementById('zoomPane');
  let introDone = false;
  let zoomStarted = false;
  let introTimers = [];

  // 창밖 도시 실루엣 (오른쪽 위 유리창은 하늘만 보이게 비워둠)
  (function buildCity() {
    const NS = 'http://www.w3.org/2000/svg';
    const city = document.getElementById('city');
    let x = 470;
    while (x < 1125) {
      const w = 36 + Math.random() * 44;
      const minTop = x + w > 800 ? 395 : 360;
      const top = minTop + Math.random() * 120;
      const b = document.createElementNS(NS, 'rect');
      b.setAttribute('x', x); b.setAttribute('y', top);
      b.setAttribute('width', w); b.setAttribute('height', 560 - top);
      b.setAttribute('fill', Math.random() < .5 ? '#232a5e' : '#2b3370');
      city.appendChild(b);
      for (let wy = top + 10; wy < 548; wy += 14) {
        for (let wx = x + 7; wx < x + w - 8; wx += 12) {
          if (Math.random() < .32) {
            const win = document.createElementNS(NS, 'rect');
            win.setAttribute('x', wx); win.setAttribute('y', wy);
            win.setAttribute('width', 5); win.setAttribute('height', 7);
            win.setAttribute('fill', Math.random() < .8 ? '#ffd98a' : '#cfe0ff');
            win.setAttribute('opacity', (.5 + Math.random() * .5).toFixed(2));
            city.appendChild(win);
          }
        }
      }
      x += w + 4 + Math.random() * 10;
    }
  })();

  // 세로 화면에서는 사람과 모니터가 가운데 오도록
  function fitScene() {
    if (zoomStarted) return;
    scene.setAttribute('viewBox', innerWidth / innerHeight < 1 ? '-110 0 1600 900' : '0 0 1600 900');
  }
  fitScene();
  addEventListener('resize', fitScene);

  function zoomIntoWindow() {
    if (zoomStarted) return;
    zoomStarted = true;
    intro.classList.add('zooming');
    const r = zoomPane.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const s = Math.max(innerWidth / r.width, innerHeight / r.height) * 1.15;
    scene.style.transformOrigin = `${cx}px ${cy}px`;
    scene.style.transform = `translate(${innerWidth / 2 - cx}px, ${innerHeight / 2 - cy}px) scale(${s})`;
    introTimers.push(setTimeout(finishIntro, 2500));
  }

  function finishIntro() {
    if (introDone) return;
    introDone = true;
    introTimers.forEach(clearTimeout);
    intro.classList.add('fade');
    document.body.classList.add('ready');
    setTimeout(() => intro.remove(), 800);
  }

  function skipIntro() {
    if (!zoomStarted) { zoomIntoWindow(); }
    else finishIntro();
  }

  document.getElementById('skipBtn').addEventListener('click', e => {
    e.stopPropagation();
    finishIntro();
  });
  intro.addEventListener('click', () => zoomIntoWindow());

  // 3초간 오피스를 보여준 뒤 창문으로 확대
  introTimers.push(setTimeout(zoomIntoWindow, 3000));
</script>
